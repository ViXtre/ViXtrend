<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Text Extractor Pro v2.3</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        /* --- 1. БАЗОВ ДИЗАЙН --- */
        body {
            margin: 0; padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #04041e;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #00f3ff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        header { text-align: center; margin: 50px 0; }
        h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 6px; border-bottom: 2px solid #00f3ff; padding-bottom: 10px; }
        #status-bar { margin-top: 15px; font-size: 0.85rem; height: 20px; color: #00f3ff; opacity: 0.8; }

        /* --- 2. ВЪЗСТАНОВЕН CYBER SCROLLBAR --- */
        #output-area::-webkit-scrollbar {
            width: 8px;
        }
        #output-area::-webkit-scrollbar-track {
            background: rgba(0, 243, 255, 0.05);
            border-radius: 10px;
        }
        #output-area::-webkit-scrollbar-thumb {
            background: rgba(0, 90, 141, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
        #output-area::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 243, 255, 0.7);
            box-shadow: 0 0 15px #00f3ff;
        }

        /* --- 3. ИНТЕРФЕЙС КАРТИ --- */
        .main-interface { display: flex; justify-content: center; gap: 30px; width: 90%; max-width: 1200px; flex-wrap: wrap; }

        .card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 20px; padding: 25px; flex: 1; min-width: 320px; height: 520px;
            display: flex; flex-direction: column; position: relative;
            transition: all 0.4s ease; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .card-label { position: absolute; top: -10px; left: 25px; background: #04041e; padding: 0 12px; border: 1px solid rgba(0, 243, 255, 0.4); font-size: 0.7rem; border-radius: 4px; letter-spacing: 2px; }

        #output-area { width: 100%; height: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; resize: none; line-height: 1.6; padding-right: 10px; }

        .upload-zone { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px dashed rgba(0, 243, 255, 0.2); border-radius: 15px; position: relative; overflow: hidden; }
        .upload-zone.dragover { background: rgba(0, 243, 255, 0.1); border-color: #00f3ff; }

        #image-preview { max-width: 95%; max-height: 90%; object-fit: contain; display: none; position: absolute; z-index: 5; }

        /* --- 4. БУТОНИ --- */
        .action-btn { background: none; border: none; cursor: pointer; z-index: 10; padding: 8px; outline: none; transition: transform 0.2s ease; }
        .action-btn svg { width: 26px; height: 26px; fill: #005a8d; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5)); transition: all 0.3s ease; }
        .action-btn:hover svg { fill: #00f3ff; transform: scale(1.1); filter: drop-shadow(0 0 8px #00f3ff); }

        .btn-left { position: absolute; bottom: 20px; left: 20px; }
        .btn-left-2 { position: absolute; bottom: 20px; left: 60px; }
        .btn-left-3 { position: absolute; bottom: 20px; left: 100px; }
        
        #btn-edit { display: none; }
        #sound-toggle { position: fixed; bottom: 30px; right: 30px; z-index: 100; }

        .scan-line { position: absolute; width: 100%; height: 2px; background: #ff00de; box-shadow: 0 0 15px #ff00de; top: 0; display: none; animation: scan 2s infinite linear; z-index: 6; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        #uploader { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>NEURAL TEXT EXTRACTOR</h1>
        <div id="status-bar">READY FOR INPUT</div>
    </header>

    <div class="main-interface">
        <div class="card">
            <div class="card-label">TERMINAL_OUTPUT</div>
            <textarea id="output-area" placeholder=">> Waiting for signal..."></textarea>
            
            <button id="btn-copy" class="action-btn btn-left" title="Копирай текста">
                <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
            </button>
            
            <button id="btn-clean" class="action-btn btn-left-2" title="Изчисти артефактите">
                <svg viewBox="0 0 24 24"><path d="M15,16H19V18H15V16M15,8H22V10H15V8M15,12H21V14H15V12M11,10V18H5V10H11M13,8H3V18A2,2 0 0,0 5,20H11A2,2 0 0,0 13,18V8M14,5H11L10,4H6L5,5H2V7H14V5Z"/></svg>
            </button>

            <button id="btn-translate" class="action-btn btn-left-3" title="Дълбок превод към БГ">
                <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
            </button>
        </div>

        <div class="card">
            <div class="card-label">SOURCE_SCANNER</div>
            <label for="uploader" class="upload-zone" id="drop-zone">
                <img id="image-preview" src="" alt="">
                <div class="scan-line" id="scanner-effect"></div>
                <svg class="upload-icon" viewBox="0 0 24 24" style="width:50px; fill:#005a8d;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span class="upload-text">DRAG & DROP or CLICK</span>
            </label>
            <button id="btn-edit" class="action-btn btn-left" title="Подобри контраста за OCR"><svg viewBox="0 0 24 24"><path d="M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25ZM20.71 7.04C21.1 6.65 21.1 6.02 20.71 5.63L18.37 3.29C17.98 2.9 17.35 2.9 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04Z"/></svg></button>
            <input type="file" id="uploader" accept="image/*,application/pdf">
        </div>
    </div>

    <button id="sound-toggle" class="action-btn" title="Звук"><svg id="sound-icon" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></button>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const uploader = document.getElementById('uploader'), statusBar = document.getElementById('status-bar'), outputArea = document.getElementById('output-area'), imagePreview = document.getElementById('image-preview'), scannerEffect = document.getElementById('scanner-effect'), dropZone = document.getElementById('drop-zone'), btnSound = document.getElementById('sound-toggle'), soundIcon = document.getElementById('sound-icon');
        let soundEnabled = true; const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playEffect(type) {
            if (!soundEnabled) return; const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
            else if (type === 'done') { osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
        }

        btnSound.onclick = () => { soundEnabled = !soundEnabled; soundIcon.style.fill = soundEnabled ? "#005a8d" : "#ff3333"; playEffect('click'); };
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }));
        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => { dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
        uploader.onchange = () => handleFile(uploader.files[0]);

        async function handleFile(file) {
            if (!file) return; playEffect('click');
            if (file.type === "application/pdf") {
                statusBar.innerText = "CONVERTING PDF...";
                const pdf = await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
                const page = await pdf.getPage(1); const viewport = page.getViewport({scale: 2});
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({canvasContext: ctx, viewport: viewport}).promise;
                const imgData = canvas.toDataURL('image/png'); displaySource(imgData); processOCR(imgData);
            } else {
                const reader = new FileReader(); reader.onload = e => { displaySource(e.target.result); processOCR(e.target.result); };
                reader.readAsDataURL(file);
            }
        }

        function displaySource(src) { imagePreview.src = src; imagePreview.style.display = 'block'; document.getElementById('btn-edit').style.display = 'block'; }

        function processOCR(source) {
            scannerEffect.style.display = 'block'; statusBar.innerText = "RUNNING NEURAL ANALYSIS...";
            Tesseract.recognize(source, 'eng+bul', {
                logger: m => { if (m.status === 'recognizing text') statusBar.innerText = `ANALYZING: ${Math.round(m.progress * 100)}%`; },
                tessedit_pageseg_mode: '3'
            }).then(({ data: { text } }) => {
                outputArea.value = text; statusBar.innerText = "ANALYSIS COMPLETE";
                scannerEffect.style.display = 'none'; playEffect('done');
            }).catch(() => { statusBar.innerText = "ERROR"; scannerEffect.style.display = 'none'; });
        }

        document.getElementById('btn-copy').onclick = () => { if (!outputArea.value) return; navigator.clipboard.writeText(outputArea.value); playEffect('click'); statusBar.innerText = "COPIED!"; };

        document.getElementById('btn-clean').onclick = () => {
            let text = outputArea.value; if (!text) return; playEffect('click');
            outputArea.value = text.replace(/[\|\~\_\\]/g, '').replace(/\n\s*\n/g, '\n').trim();
            statusBar.innerText = "CLEANED";
        };

        // --- ОБНОВЕН ПРЕВОД СЪС ЗАЩИТА СРЕЩУ ПРОПУСНАТИ ДУМИ ---
        document.getElementById('btn-translate').onclick = async () => {
            const rawText = outputArea.value;
            if (!rawText) return;
            playEffect('click');
            statusBar.innerText = "DEEP TRANSLATION IN PROGRESS...";
            
            const lines = rawText.split('\n');
            let translatedLines = [];

            try {
                for (let line of lines) {
                    if (line.trim() === "") { translatedLines.push(""); continue; }
                    
                    // Почистваме артефактите само за превода, за да не объркват API-то
                    let cleanLine = line.replace(/[\|_\\~]/g, ' ').trim();

                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanLine)}&langpair=en|bg`);
                    const data = await response.json();
                    
                    let result = data.responseData ? data.responseData.translatedText : line;

                    // Fallback logic: Ако преводът е идентичен с оригинала и е на английски
                    if (result.toLowerCase() === cleanLine.toLowerCase() && /[a-zA-Z]/.test(result)) {
                        // Правим втори опит с лека промяна в заявката
                        const secondResponse = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanLine.toLowerCase())}&langpair=en|bg`);
                        const secondData = await secondResponse.json();
                        result = secondData.responseData ? secondData.responseData.translatedText : result;
                    }

                    translatedLines.push(result);
                    await new Promise(r => setTimeout(r, 60)); 
                }
                outputArea.value = translatedLines.join('\n');
                statusBar.innerText = "TRANSLATION COMPLETE";
                playEffect('done');
            } catch (e) { statusBar.innerText = "API CONNECTION ERROR"; }
        };

        document.getElementById('btn-edit').onclick = () => {
            playEffect('click'); const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height), d = imgData.data;
                for (let i = 0; i < d.length; i += 4) { const v = (0.34*d[i] + 0.5*d[i+1] + 0.16*d[i+2] < 145) ? 0 : 255; d[i] = d[i+1] = d[i+2] = v; }
                ctx.putImageData(imgData, 0, 0); const newSrc = canvas.toDataURL(); imagePreview.src = newSrc; processOCR(newSrc);
            }; img.src = imagePreview.src;
        };
    </script>
</body>
</html>
